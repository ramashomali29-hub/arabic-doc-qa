services:
  ollama:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama

  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    depends_on:
      - ollama
    volumes:
      - chroma_data:/app/chroma_db
      - hf_cache:/home/appuser/.cache/huggingface

volumes:
  ollama_data:
  chroma_data:
  hf_cache: